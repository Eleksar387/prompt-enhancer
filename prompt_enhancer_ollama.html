    const { useState, useRef, useEffect } = React;
    const html = htm.bind(React.createElement);

    /* ===================================================================
       TWO-STAGE pipeline:
         Stage 1 (vision model, e.g. qwen2.5vl): describe the image frame(s).
         Stage 2 (writer model, e.g. mistral-nemo): write the LTX/FLUX prompt
                 from that description + the user's controls.
       Text-only inputs skip stage 1. Caption is shown read-only (collapsed).
       =================================================================== */

    const SYSTEM_PROMPT_LTX = `You are rewriting a user request into an LTX-2.3 image-to-video prompt for ComfyUI.

CONTEXT
You are given a TEXT DESCRIPTION of the first frame (produced by a vision model). It already
establishes subject, lighting, color, wardrobe, and setting. Do NOT re-describe what the
description already covers — describe what HAPPENS over time. Clips are short by default
(97 frames, ~4 seconds) unless a longer duration is specified, so keep the action budget tight.

SCENE SOURCE
If the user provides a scene description, base the prompt on it. If they provide NO
scene description (frame description only), invent ONE fitting, cinematic moment of motion
that suits the subject and setting. Stay within the action budget.

FIRST–LAST FRAME (END-FRAME INTERPOLATION) MODE
Sometimes you are given descriptions of TWO frames: a FIRST frame and a LAST frame. The clip
begins exactly on the first frame and ends exactly on the last frame; the model interpolates
between them. Describe the MOTION and camera movement that carries the scene from the first
frame to the last without contradicting either endpoint. If no description is given, infer the
most natural connecting motion. Still obey TEMPORAL OVERLOADING and ACTION DENSITY — describe
one coherent transition, not a chaotic multi-beat sequence.

STYLE / MOOD
The user may specify a style or mood. Let it shape tone, energy, and choice of motion
and audio — but never at the expense of the technical rules. If none is given, fit the frame.

STRUCTURE
Output ONE flowing paragraph in present tense. No headers, no screenplay formatting,
no bullet points, no markdown. Roughly 3–5 sentences for the default ~4s clip; scale up
for longer durations. Length is a ceiling, not a target — a tight prompt beats a bloated one.

ACTION DENSITY — KEEP IT LOW
Official LTX-2.3 guidance: one clear subject, one main action per clip. Count DISTINCT
actions (things that HAPPEN, not descriptive detail) and keep low:
- 97 frames (~4s): 1 primary action + at most 1 small compatible micro-action
- 8s: 1–2 · 12s: 2–3 · 16s: 2–4 · 20s: 3–5
These are ceilings. Descriptive DETAIL (appearance, lighting, camera, atmosphere, audio)
SHOULD scale up with duration; the number of things that happen must stay low.

TEMPORAL OVERLOADING — MOST IMPORTANT RULE FOR SHORT CLIPS
At ~4s the model CANNOT execute a chronological script. It does not understand "then,"
"after," or "once." A chain of beats collapses and all are attempted simultaneously
(head permanently tilted, eyes half-closed, mouth twitching). Describe ONE continuous
state/action. Limit chained "then…" beats for subject motion to one or two compatible
simultaneous micro-actions. Sequential connectors are for distributing a single CAMERA
move across the duration, not for scripting subject actions.

DESCRIBE ACTIVE STATES, NOT ABSENCES OR DELAYS
"unblinking" → "gaze steady and fixed"; "a half-beat too slow" → "slow, heavy blinks."
Convert absences/delays into the positive visible state.

CONTENT, roughly in order: (1) short anchoring phrase for subject + setting; (2) camera
behavior — incorporate requested moves; ONE primary move (two max at 8s+); natural-language
velocity; sequential connectors to spread one move; (3) subject motion, physical visible
cues not labels, one continuous action; (4) lighting fixed or evolving + source; (5) background
parallax only if camera/subject moves; (6) atmosphere — wind, particles, steam; (7) audio LAST
as a textural recipe (ambient/foley; LTX is strongest here). DIALOGUE: if dialogue text is
provided, include those EXACT words in quotation marks, broken into short phrases with physical
acting beats, naming voice/delivery; short lines need ~4s, full sentences need 8s+; don't invent
extra words. If no dialogue, don't invent speech — ambient/foley plus vocal TEXTURE only.

WHAT LTX-2.3 IS BAD AT (don't ask for it): chaotic body motion; rigid-body destruction;
multi-stage physical comedy; slow body-pans up a figure (use end-frame interpolation);
readable text/logos; numerical motion specs; two distinct camera moves with a transition;
fast camera + chaotic motion; handheld + zoom. If a request centers on one of these, flag it.

RULES: present tense; no re-describing static frame elements; no new objects mid-prompt;
no contradictions; no negation in the positive prompt; don't itemize body parts during a move.

OUTPUT: always English even if the input is another language. No negative prompt (handled
separately). Return only the prompt paragraph.`;

    const SYSTEM_PROMPT_FLUX = `You are rewriting a user request into a FLUX.dev image-generation prompt.

ABOUT FLUX.dev
FLUX.dev is a text-to-image diffusion model with a T5 text encoder, so it understands
natural, descriptive language — full sentences, NOT keyword soup. Write as if describing
a finished photograph or artwork to a person.

LENGTH & STRUCTURE
- One coherent, natural-language paragraph in present tense. No bullets, markdown, or headers.
- Aim for a focused ~40–90 words. FLUX.1-dev rewards specificity but does NOT need a wall of
  text — a tight, well-ordered prompt beats a bloated one.
- FRONT-LOAD: put the main subject and its key attributes FIRST. FLUX.1-dev uses two encoders —
  a T5 that sees the whole prompt and a CLIP capped at ~77 tokens — and earlier words carry more
  weight, so subject + key features + core composition come first; secondary detail after.
- Order: subject + key attributes → action/pose → composition/framing → setting → lighting,
  color, mood → medium/style and technical detail (lens, film stock, render type).
- Be specific: "a weathered fisherman in his sixties with deep smile lines" beats "a man."

WHAT WORKS: natural-language detail; photographic vocabulary for realism (lens, aperture,
film stock, lighting setup); art-medium vocabulary for art; legible text — FLUX renders text
well, so put exact wanted words in quotation marks; composition terms.

WHAT TO AVOID: SD-style weighting syntax like (word:1.3), [word], or :: (FLUX mishandles it —
use natural emphasis); quality-token spam ("masterpiece, 8k, ultra-detailed"); a negative prompt
(the standard FLUX.dev pipeline is guidance-distilled and uses none); contradictions/impossible
physics unless surrealism is requested.

STYLE / MOOD: if specified, let it drive medium, palette, lighting, feeling. If none, fit the subject.

REFERENCE: if a reference-image description is provided, use it so the result resembles that
image (subject, composition, lighting, palette, style) — unless a variation is asked.

OUTPUT: always English. Return only the prompt. No preamble, no negative prompt.`;

    /* ---- Stage-1 vision (captioner) system prompts ---- */
    const VISION_PROMPT_LTX_SINGLE = `You are a vision model captioning the FIRST FRAME of a video clip for a downstream prompt writer.
Describe ONLY what is visibly present: the main subject and its appearance/wardrobe, the setting/background,
the lighting (direction and quality), the color palette, the framing/composition, and the overall mood.
Be concrete and concise — 2 to 4 sentences. Do NOT speculate about motion, story, or what happens next.
Do NOT add camera directions. Output only the description, with no preamble or labels.`;

    const VISION_PROMPT_LTX_FIRSTLAST = `You are a vision model captioning the FIRST and LAST frames of a video clip for a downstream prompt writer.
For each frame describe its visible contents (subject, wardrobe, setting, lighting, palette, composition),
then state what visibly differs between them. Be concrete and concise. Do NOT invent motion beyond what the
two frames imply. Format your answer EXACTLY as:
FIRST FRAME: <description>
LAST FRAME: <description>
CHANGE: <what visibly differs between the two>
Output only those three lines, no preamble.`;

    const VISION_PROMPT_FLUX = `You are a vision model describing a reference image so a downstream writer can reproduce it as a
FLUX.dev text-to-image prompt. Describe in precise, prompt-ready natural language: the main subject and its
key attributes, composition/framing, setting, lighting, color palette, and medium/style (photographic or
artistic; include lens or film cues if photographic). Be specific and concise. Output only the description,
with no preamble.`;

      { id: "funny", label: "Funny", hint: "witty and clever — humor from an ironic or unexpected situation, a deadpan detail, or comic incongruity in the scene; keep it smart and grounded, NOT slapstick, cartoonish, googly-eyed, or childish" },

      { id: "energetic", label: "Energetic", hint: "lively, dynamic, vivid and upbeat" },
      { id: "mysterious", label: "Mysterious", hint: "moody, enigmatic, shadowy, suspenseful" },

          { id: "handheld", label: "Handheld drift", desc: "Faint organic breathing movement", prompt: "the camera drifts subtly with a slight handheld feel" },
        ]
      },

        group: "Toward / Away", moves: [
          { id: "dolly_in", label: "Dolly-in", desc: "Camera pushes forward toward subject", prompt: "a slow dolly-in toward the subject" },
          { id: "dolly_out", label: "Dolly-out", desc: "Camera retreats, reveals context", prompt: "a slow pull-back dollying away from the subject" },
          { id: "zoom_in", label: "Zoom-in", desc: "Focal length tightens (no movement)", prompt: "a slow zoom-in tightening on the subject" },

      },
      {
        group: "Vertical", moves: [
          { id: "tilt_up", label: "Tilt up", desc: "Camera angle rotates upward", prompt: "a slow tilt up" },
          { id: "tilt_down", label: "Tilt down", desc: "Camera angle rotates downward", prompt: "a slow tilt down" },
          { id: "crane_up", label: "Crane up", desc: "Camera body rises through space", prompt: "a smooth crane up" },
          { id: "crane_down", label: "Crane down", desc: "Camera body descends", prompt: "a smooth crane down" },
        ]

        group: "Aerial / Ground", moves: [
          { id: "drone", label: "Drone descent", desc: "Camera flies down through space", prompt: "a slow drone descent into the scene" },

          { id: "ground", label: "Ground-level", desc: "Camera glides inches above ground", prompt: "a ground-skimming tracking shot at floor level" },
        ]
      },
      {
        group: "Subject-relative", moves: [
          { id: "ots", label: "Over-the-shoulder", desc: "Camera behind one character framing another", prompt: "an over-the-shoulder framing" },
          { id: "pov", label: "POV", desc: "Camera is the character's eyes", prompt: "a first-person point-of-view perspective" },
          { id: "follow", label: "Following shot", desc: "Camera trails behind subject", prompt: "a steady following shot trailing behind the subject" },
          { id: "linger", label: "Lingering hold", desc: "Camera holds longer than expected", prompt: "the camera lingers on the subject in a slow hold" },
        ]
      },
      {
        group: "Focus", moves: [
          { id: "rack", label: "Rack focus", desc: "Focus shifts between subjects", prompt: "a slow rack focus shifting from foreground to background" },
          { id: "shallow", label: "Shallow DOF", desc: "Subject sharp, background blurred", prompt: "shallow depth of field with the background softly blurred" },
        ]
      },
    ];

    const LTX_RESOLUTIONS = [
      { id: "1080p", label: "1920×1080", w: 1920, h: 1080, ratio: 16 / 9, note: "Full HD · 16:9 · high VRAM" },
      { id: "720p", label: "1280×720", w: 1280, h: 720, ratio: 16 / 9, note: "HD · 16:9 · lower VRAM" },
      { id: "vertical", label: "1080×1920", w: 1080, h: 1920, ratio: 9 / 16, note: "Vertical · 9:16 · mobile" },
      { id: "land32", label: "768×512", w: 768, h: 512, ratio: 3 / 2, note: "Landscape · 3:2 · fast iteration" },
      { id: "port23", label: "512×768", w: 512, h: 768, ratio: 2 / 3, note: "Portrait · 2:3 · fast iteration" },
      { id: "sq1024", label: "1024×1024", w: 1024, h: 1024, ratio: 1, note: "Square · 1:1" },
      { id: "square", label: "640×640", w: 640, h: 640, ratio: 1, note: "Square · 1:1 · fast iteration" },
    ];

    const FLUX_RESOLUTIONS = [
      { id: "sq", label: "1024×1024", w: 1024, h: 1024, ratio: 1, note: "Square · 1:1" },
      { id: "land32", label: "1216×832", w: 1216, h: 832, ratio: 1216 / 832, note: "Landscape · 3:2" },
      { id: "port23", label: "832×1216", w: 832, h: 1216, ratio: 832 / 1216, note: "Portrait · 2:3" },
      { id: "land169", label: "1344×768", w: 1344, h: 768, ratio: 1344 / 768, note: "Landscape · 16:9" },
      { id: "port916", label: "768×1344", w: 768, h: 1344, ratio: 768 / 1344, note: "Portrait · 9:16" },
    ];

    const TARGETS = {
      ltx: {
        id: "ltx", label: "LTX-2.3 · Video", type: "video", system: SYSTEM_PROMPT_LTX,
        subtitle: "Describe your scene → get a cinematic LTX-2.3 prompt",
        resolutions: LTX_RESOLUTIONS,
        show: { duration: true, camera: true, dialogue: true, frameMode: true, twoStage: true },
      },
      flux: {
        id: "flux", label: "FLUX.dev · Image", type: "image", system: SYSTEM_PROMPT_FLUX,
        subtitle: "Describe your image → get a detailed FLUX.dev prompt",
        resolutions: FLUX_RESOLUTIONS,
        show: { duration: false, camera: false, dialogue: false, frameMode: false, twoStage: false },
      },
    };

    const presetById = (id, presets) => presets.find(p => p.id === id);
    const snap32 = (n) => Math.round(n / 32) * 32;
    const btn = (active) => ({ padding: "6px 14px", borderRadius: 6, border: "1px solid", borderColor: active ? "#7c6af7" : "#333", background: active ? "#2d2060" : "#1a1a2e", color: active ? "#c4b8ff" : "#888", fontSize: 12, cursor: "pointer", transition: "all 0.15s" });
    const moveLabel = (id) => CAMERA_GROUPS.flatMap(g => g.moves).find(m => m.id === id)?.label || id;
    const selStyle = { width: "100%", boxSizing: "border-box", background: "#12121f", border: "1px solid #2e2e44", borderRadius: 8, padding: "9px 12px", color: "#e0e0f0", fontSize: 13, outline: "none", cursor: "pointer" };

    function recommendRes(nw, nh, presets) {
      const r = nw / nh;
      let best = null, bestScore = Infinity;
      for (const p of presets) {
        const aspectDiff = Math.abs(Math.log(r / p.ratio));
        const cropW = r > p.ratio ? nh * p.ratio : nw;
        const upscale = p.w > cropW + 1;
        let score = aspectDiff * 100 + (upscale ? 10 : 0);
        score += upscale ? p.w * 1e-5 : -p.w * 1e-5;
        if (score < bestScore) { bestScore = score; best = p; }
      }
      return best.id;
    }

    function ratioLabel(r) {
      const known = [[16 / 9, "16:9"], [9 / 16, "9:16"], [3 / 2, "3:2"], [2 / 3, "2:3"], [4 / 3, "4:3"], [3 / 4, "3:4"], [1, "1:1"], [21 / 9, "21:9"], [5 / 4, "5:4"]];
      let best = "", d = Infinity;
      for (const [v, l] of known) { const diff = Math.abs(Math.log(r / v)); if (diff < d) { d = diff; best = l; } }
      return best;
    }

    /* ---- Backend config (persisted) ---- */
    const CFG_KEY = "ollama-enhancer-config";
    const DEFAULT_CFG = { base: "http://localhost:11434/v1", apiKey: "", temperature: 0.7 };
    function loadCfg() {
      try { const raw = localStorage.getItem(CFG_KEY); if (raw) return { ...DEFAULT_CFG, ...JSON.parse(raw) }; } catch { }
      return { ...DEFAULT_CFG };
    }
    function saveCfg(cfg) { try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch { } }

    function toOpenAIContent(userContent) {
      if (typeof userContent === "string") return userContent;
      return userContent.map(b => {
        if (b.type === "text") return { type: "text", text: b.text };
        if (b.type === "image") return { type: "image_url", image_url: { url: `data:${b.source.media_type};base64,${b.source.data}` } };
        return null;
      }).filter(Boolean);
    }

    async function callOllama(model, userContent, system, cfg, temperature) {
      const base = (cfg.base || "").replace(/\/+$/, "");
      const messages = [];
      if (system) messages.push({ role: "system", content: system });
      messages.push({ role: "user", content: toOpenAIContent(userContent) });
      const headers = { "Content-Type": "application/json" };
      if (cfg.apiKey) headers["Authorization"] = `Bearer ${cfg.apiKey}`;
      let res;
      try {
        res = await fetch(`${base}/chat/completions`, {
          method: "POST", headers,
          body: JSON.stringify({ model, messages, max_tokens: 1000, temperature, stream: false }),
        });
      } catch (e) {
        throw new Error(`Network/CORS error reaching ${base}. Is Ollama running and is OLLAMA_ORIGINS set to allow this page? (${e.message})`);
      }
      if (!res.ok) {
        let msg = `HTTP ${res.status}`;
        try { const j = await res.json(); msg = (j.error && (j.error.message || j.error)) || msg; } catch { }
        throw new Error(msg);
      }
      const data = await res.json();
      const text = data.choices?.[0]?.message?.content || "";
      if (!text) throw new Error(`Unexpected response: ${JSON.stringify(data).slice(0, 300)}`);
      const usage = data.usage
        ? { input_tokens: data.usage.prompt_tokens ?? "?", output_tokens: data.usage.completion_tokens ?? "?" }
        : null;
      return { text: text.trim(), usage };
    }

    async function fetchModels(cfg) {
      const base = (cfg.base || "").replace(/\/+$/, "");
      const headers = {};
      if (cfg.apiKey) headers["Authorization"] = `Bearer ${cfg.apiKey}`;
      const res = await fetch(`${base}/models`, { headers });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      return (data.data || []).map(m => m.id).filter(Boolean);
    }

    const pickWriter = (ids) =>
      ["mistral-nemo:latest", "mistral-nemo"].find(p => ids.includes(p))
      || ids.find(id => !/embed|bge-m3|:vl|qwen.*vl|vision|llava|minicpm/i.test(id))
      || ids[0] || "";
    const pickVision = (ids) =>
      ["qwen2.5vl:7b", "qwen2.5vl"].find(p => ids.includes(p))
      || ids.find(id => /vl|vision|llava|minicpm|gemma3/i.test(id))
      || ids[0] || "";

    function ConfigBar({ cfg, setCfg, models, modelStatus, reloadModels }) {
      const [open, setOpen] = useState(false);
      const input = { width: "100%", boxSizing: "border-box", background: "#12121f", border: "1px solid #2e2e44", borderRadius: 7, padding: "8px 11px", color: "#e0e0f0", fontSize: 13, outline: "none" };
      const lbl = { fontSize: 10, color: "#666", textTransform: "uppercase", letterSpacing: "0.5px", display: "block", marginBottom: 4 };
      const statusColor = modelStatus.ok ? "#4ade80" : modelStatus.loading ? "#9a8fd8" : "#f87171";
      return html`
    <div style=${{ marginBottom: 20, background: "#0e0e1c", border: "1px solid #2a2a3f", borderRadius: 10, padding: "10px 14px" }}>
      <div style=${{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10 }}>
        <button onClick=${() => setOpen(v => !v)} style=${{ display: "flex", alignItems: "center", gap: 8, background: "none", border: "none", padding: 0, cursor: "pointer", color: "#888", fontSize: 12 }}>
          <span style=${{ display: "inline-block", transition: "transform 0.2s", transform: open ? "rotate(90deg)" : "rotate(0deg)" }}>▶</span>
          ⚙ Local backend
        </button>
        <span style=${{ fontSize: 11, color: statusColor }}>
          ${modelStatus.loading ? "connecting…" : modelStatus.ok ? `${models.length} model${models.length === 1 ? "" : "s"} · ${cfg.base}` : `not connected · ${modelStatus.error || ""}`}
        </span>
      </div>
      ${open && html`
        <div style=${{ marginTop: 12, display: "flex", flexDirection: "column", gap: 10 }}>
          <div>
            <label style=${lbl}>Base URL (OpenAI-compatible)</label>
            <input style=${input} value=${cfg.base} onChange=${e => setCfg({ ...cfg, base: e.target.value })}
              placeholder="http://localhost:11434/v1" spellCheck=${false} />
            <div style=${{ fontSize: 11, color: "#555", marginTop: 5, lineHeight: 1.5 }}>
              Ollama direct: <span style=${{ color: "#9a8fd8" }}>http://localhost:11434/v1</span> (needs <span style=${{ color: "#9a8fd8" }}>OLLAMA_ORIGINS=*</span>).
              Use <span style=${{ color: "#9a8fd8" }}>localhost</span>, not host.docker.internal — this runs in your browser.
            </div>
          </div>
          <div style=${{ display: "flex", gap: 10, flexWrap: "wrap" }}>
            <div style=${{ flex: "1 1 220px" }}>
              <label style=${lbl}>API key (only for Open WebUI / remote)</label>
              <input style=${input} value=${cfg.apiKey} onChange=${e => setCfg({ ...cfg, apiKey: e.target.value })}
                placeholder="leave blank for local Ollama" type="password" spellCheck=${false} />
            </div>
            <div style=${{ width: 130 }}>
              <label style=${lbl}>Writer temp</label>
              <input style=${input} type="number" min=${0} max=${2} step=${0.05} value=${cfg.temperature}
                onChange=${e => setCfg({ ...cfg, temperature: parseFloat(e.target.value) || 0 })} />
            </div>
          </div>
          <button onClick=${reloadModels} style=${{ alignSelf: "flex-start", padding: "7px 16px", borderRadius: 7, border: "1px solid #3a2f6e", background: "#1e1850", color: "#c4b8ff", fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>
            ↻ Reload models
          </button>
          ${!modelStatus.ok && !modelStatus.loading && html`
            <div style=${{ fontSize: 11.5, color: "#f0b070", background: "#241a0e", border: "1px solid #4a3520", borderRadius: 6, padding: "8px 11px", lineHeight: 1.5 }}>
              Couldn't list models. Most common cause: CORS. Set <b>OLLAMA_ORIGINS=*</b> and restart Ollama. You can still type model names manually below.
            </div>
          `}
        </div>
      `}
    </div>
  `;
    }

    function ImagePanel({ label, hint, onChange, presets, showTwoStage }) {
      const [image, setImage] = useState(null);
      const [targetRes, setTargetRes] = useState(presets[1] ? presets[1].id : presets[0].id);
      const [cropOpen, setCropOpen] = useState(false);
      const [cropPos, setCropPos] = useState(0.5);
      const [croppedUrl, setCroppedUrl] = useState(null);
      const [croppedDims, setCroppedDims] = useState(null);
      const fileInputRef = useRef(null);

      const loadFile = (file) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const nativeW = img.naturalWidth, nativeH = img.naturalHeight;
            const MAX = 1536;
            let w = img.width, h = img.height;
            if (w > MAX || h > MAX) { if (w >= h) { h = Math.round(h * MAX / w); w = MAX; } else { w = Math.round(w * MAX / h); h = MAX; } }
            const canvas = document.createElement("canvas");
            canvas.width = w; canvas.height = h;
            canvas.getContext("2d").drawImage(img, 0, 0, w, h);
            let dataUrl = canvas.toDataURL("image/jpeg", 0.85);
            if (dataUrl.length * 0.75 > 4 * 1024 * 1024) dataUrl = canvas.toDataURL("image/jpeg", 0.7);
            const obj = { base64: dataUrl.split(",")[1], mediaType: "image/jpeg", previewUrl: dataUrl, originalUrl: e.target.result, nativeW, nativeH, fileName: file.name };
            setImage(obj); setTargetRes(recommendRes(nativeW, nativeH, presets)); setCropPos(0.5);
            onChange && onChange(obj);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      };

      const onFileChange = (e) => loadFile(e.target.files[0]);
      const onDrop = (e) => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f?.type.startsWith("image/")) loadFile(f); };
      const removeImage = () => { setImage(null); setCroppedUrl(null); if (fileInputRef.current) fileInputRef.current.value = ""; onChange && onChange(null); };

      const selPreset = presetById(targetRes, presets) || presets[0];
      const imgRatio = image ? image.nativeW / image.nativeH : null;
      const resMismatch = image && Math.abs(Math.log(imgRatio / selPreset.ratio)) > 0.08;
      const halfW = snap32(selPreset.w / 2), halfH = snap32(selPreset.h / 2);
      const cropAxis = !image ? "none" : (Math.abs(imgRatio - selPreset.ratio) < 1e-3 ? "none" : (imgRatio > selPreset.ratio ? "x" : "y"));
      const keepWPct = image && cropAxis === "x" ? (selPreset.ratio / imgRatio) * 100 : 100;
      const keepHPct = image && cropAxis === "y" ? (imgRatio / selPreset.ratio) * 100 : 100;
      const offXPct = cropPos * (100 - keepWPct);
      const offYPct = cropPos * (100 - keepHPct);
      const cropAvailW = image ? (imgRatio > selPreset.ratio ? image.nativeH * selPreset.ratio : image.nativeW) : 0;
      const wouldUpscale = image && selPreset.w > cropAvailW + 1;
      const outW = wouldUpscale ? snap32(cropAvailW) : selPreset.w;
      const outH = wouldUpscale ? snap32(cropAvailW / selPreset.ratio) : selPreset.h;

      const exportCrop = () => {
        if (!image) return;
        const im = new Image();
        im.onload = () => {
          const tR = selPreset.ratio;
          const NW = image.nativeW, NH = image.nativeH, nR = NW / NH;
          let sx = 0, sy = 0, sw = NW, sh = NH;
          if (nR > tR) { sw = Math.round(NH * tR); sx = Math.round((NW - sw) * cropPos); }
          else if (nR < tR) { sh = Math.round(NW / tR); sy = Math.round((NH - sh) * cropPos); }
          const c = document.createElement("canvas");
          c.width = outW; c.height = outH;
          c.getContext("2d").drawImage(im, sx, sy, sw, sh, 0, 0, outW, outH);
          c.toBlob(b => { if (b) { setCroppedDims({ w: outW, h: outH }); setCroppedUrl(URL.createObjectURL(b)); } }, "image/png");
        };
        im.src = image.originalUrl;
      };

      useEffect(() => { setCroppedUrl(prev => { if (prev) URL.revokeObjectURL(prev); return null; }); setCroppedDims(null); }, [cropPos, targetRes, image]);

      return html`
    <div style=${{ marginBottom: 16 }}>
      <label style=${{ fontSize: 11, color: "#777", display: "block", marginBottom: 6, textTransform: "uppercase", letterSpacing: "0.5px" }}>
        ${label} ${hint && html`<span style=${{ color: "#555", textTransform: "none", letterSpacing: 0 }}>${hint}</span>`}
      </label>
      ${image ? html`
        <>
          <div style=${{ display: "flex", alignItems: "center", gap: 14, padding: "12px 14px", background: "#12121f", border: "1px solid #3a2f6e", borderRadius: 8 }}>
            <img src=${image.previewUrl} alt="ref" style=${{ width: 72, height: 56, objectFit: "cover", borderRadius: 6, border: "1px solid #2e2e44" }} />
            <div style=${{ flex: 1, fontSize: 12, color: "#888" }}>${label} loaded · <span style=${{ color: "#666" }}>${image.fileName}</span></div>
            <button onClick=${removeImage} style=${{ padding: "5px 10px", borderRadius: 6, border: "1px solid #3a2040", background: "#1e1020", color: "#f87171", fontSize: 11, cursor: "pointer" }}>Remove</button>
          </div>
          <div style=${{ marginTop: 8, fontSize: 11, color: "#6f7a92" }}>👁 Read by your Vision model at generate time, then handed to the Writer.</div>

          <div style=${{ marginTop: 12, background: "#0e0e1c", border: "1px solid #2e2e44", borderRadius: 10, padding: "14px 16px" }}>
            <div style=${{ fontSize: 12, color: "#888", marginBottom: 12 }}>
              Detected <span style=${{ color: "#c4b8ff", fontWeight: 600 }}>${image.nativeW}×${image.nativeH}</span> · ${ratioLabel(imgRatio)}
            </div>
            <div style=${{ fontSize: 10, color: "#555", textTransform: "uppercase", letterSpacing: "0.5px", marginBottom: 8 }}>Target resolution</div>
            <div style=${{ display: "flex", gap: 6, flexWrap: "wrap" }}>
              ${presets.map(p => {
        const active = targetRes === p.id;
        const rec = recommendRes(image.nativeW, image.nativeH, presets) === p.id;
        const pCropW = imgRatio > p.ratio ? image.nativeH * p.ratio : image.nativeW;
        const pUp = p.w > pCropW + 1;
        return html`
                  <button key=${p.id} onClick=${() => setTargetRes(p.id)} title=${pUp ? `${p.note} — larger than your source, would upscale` : p.note} style=${{ ...btn(active), display: "flex", alignItems: "center", gap: 6 }}>
                    ${p.label}
                    ${rec && html`<span style=${{ fontSize: 9, color: active ? "#c4b8ff" : "#6a5acf", border: "1px solid", borderColor: active ? "#7c6af7" : "#3a3060", borderRadius: 8, padding: "0 5px" }}>best fit</span>`}
                    ${pUp && html`<span title="would upscale your source" style=${{ fontSize: 11, color: active ? "#e0a0a0" : "#9a6a6a" }}>↑</span>`}
                  </button>
                `;
      })}
            </div>
            ${resMismatch && html`
              <div style=${{ marginTop: 12, fontSize: 11.5, color: "#f0b070", background: "#241a0e", border: "1px solid #4a3520", borderRadius: 6, padding: "8px 11px", lineHeight: 1.5 }}>
                Your image is ${ratioLabel(imgRatio)} but ${selPreset.label} is ${ratioLabel(selPreset.ratio)} — it will be cropped or letterboxed. Pick the matching aspect ratio to avoid this.
              </div>
            `}
            ${showTwoStage ? html`
              <div style=${{ marginTop: 12, fontSize: 11.5, color: "#666", lineHeight: 1.6 }}>
                <span style=${{ color: "#888" }}>Two-stage render workflow:</span> Stage 1 at <span style=${{ color: "#9a8fd8" }}>${halfW}×${halfH}</span> (half-res), then 2× upscale with LTXVUpscale to <span style=${{ color: "#9a8fd8" }}>${selPreset.w}×${selPreset.h}</span>. Dimensions must be divisible by 32.
              </div>
            ` : html`
              <div style=${{ marginTop: 12, fontSize: 11.5, color: "#666", lineHeight: 1.6 }}>
                These presets are the model's recommended sizes — FLUX.1-dev is trained around ~1 megapixel, dimensions are multiples of 32.
              </div>
            `}

            <div style=${{ marginTop: 14, borderTop: "1px solid #1e1e30", paddingTop: 12 }}>
              <button onClick=${() => setCropOpen(v => !v)} style=${{ display: "flex", alignItems: "center", gap: 8, background: "none", border: "none", padding: 0, cursor: "pointer", color: "#888", fontSize: 12 }}>
                <span style=${{ display: "inline-block", transition: "transform 0.2s", transform: cropOpen ? "rotate(90deg)" : "rotate(0deg)" }}>▶</span>
                ✂ Crop to ${selPreset.label}
              </button>
              ${cropOpen && html`
                <div style=${{ marginTop: 12 }}>
                  <div style=${{ position: "relative", borderRadius: 8, overflow: "hidden", border: "1px solid #2e2e44", maxWidth: 360 }}>
                    <img src=${image.previewUrl} alt="crop preview" style=${{ display: "block", width: "100%" }} />
                    ${cropAxis === "x" && html`
                      <>
                        <div style=${{ position: "absolute", top: 0, bottom: 0, left: 0, width: `${offXPct}%`, background: "rgba(8,8,16,0.72)" }} />
                        <div style=${{ position: "absolute", top: 0, bottom: 0, left: `${offXPct + keepWPct}%`, right: 0, background: "rgba(8,8,16,0.72)" }} />
                        <div style=${{ position: "absolute", top: 0, bottom: 0, left: `${offXPct}%`, width: `${keepWPct}%`, border: "2px solid #7c6af7", boxSizing: "border-box", pointerEvents: "none" }} />
                      </>
                    `}
                    ${cropAxis === "y" && html`
                      <>
                        <div style=${{ position: "absolute", left: 0, right: 0, top: 0, height: `${offYPct}%`, background: "rgba(8,8,16,0.72)" }} />
                        <div style=${{ position: "absolute", left: 0, right: 0, top: `${offYPct + keepHPct}%`, bottom: 0, background: "rgba(8,8,16,0.72)" }} />
                        <div style=${{ position: "absolute", left: 0, right: 0, top: `${offYPct}%`, height: `${keepHPct}%`, border: "2px solid #7c6af7", boxSizing: "border-box", pointerEvents: "none" }} />
                      </>
                    `}
                  </div>
                  ${cropAxis !== "none" ? html`
                    <div style=${{ marginTop: 10 }}>
                      <label style=${{ fontSize: 11, color: "#777" }}>${cropAxis === "x" ? "Horizontal position" : "Vertical position"}</label>
                      <input type="range" min=${0} max=${1} step=${0.01} value=${cropPos} onChange=${e => setCropPos(parseFloat(e.target.value))} style=${{ width: "100%", maxWidth: 360, display: "block", marginTop: 4 }} />
                    </div>
                  ` : html`
                    <div style=${{ marginTop: 10, fontSize: 11.5, color: "#666" }}>Aspect ratio already matches — export resizes to ${selPreset.w}×${selPreset.h}.</div>
                  `}
                  ${wouldUpscale && html`
                    <div style=${{ marginTop: 10, fontSize: 11.5, color: "#f0b070", background: "#241a0e", border: "1px solid #4a3520", borderRadius: 6, padding: "8px 11px", lineHeight: 1.5 }}>
                      ${selPreset.label} is larger than your ${image.nativeW}×${image.nativeH} source, so export is capped to ${outW}×${outH} to avoid upscaling.
                    </div>
                  `}
                  <button onClick=${exportCrop} style=${{ marginTop: 12, padding: "8px 16px", borderRadius: 7, border: "1px solid #3a2f6e", background: "#1e1850", color: "#c4b8ff", fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>
                    ✂ Generate cropped ${outW}×${outH}
                  </button>
                  ${croppedUrl && croppedDims && html`
                    <div style=${{ marginTop: 14 }}>
                      <div style=${{ fontSize: 10, color: "#555", textTransform: "uppercase", letterSpacing: "0.5px", marginBottom: 6 }}>Result — ${croppedDims.w}×${croppedDims.h}</div>
                      <img src=${croppedUrl} alt="cropped result" style=${{ maxWidth: 360, width: "100%", display: "block", borderRadius: 8, border: "1px solid #3a2f6e" }} />
                      <a href=${croppedUrl} download=${`${label.replace(/\s+/g, "-").toLowerCase()}-${croppedDims.w}x${croppedDims.h}.png`} style=${{ display: "inline-block", marginTop: 10, padding: "8px 16px", borderRadius: 7, border: "1px solid #3a2f6e", background: "#1e1850", color: "#c4b8ff", fontSize: 12.5, fontWeight: 600, cursor: "pointer", textDecoration: "none" }}>⬇ Save PNG</a>
                      <div style=${{ fontSize: 11, color: "#666", marginTop: 8, lineHeight: 1.5 }}>If the Save button doesn't download, right-click the image (or long-press on mobile) and choose "Save image as…".</div>
                    </div>
                  `}
                </div>
              `}
            </div>
          </div>
        </>
      ` : html`
        <div
          onClick=${() => fileInputRef.current?.click()} onDrop=${onDrop} onDragOver=${e => e.preventDefault()}
          style=${{ padding: "20px", borderRadius: 8, border: "1px dashed #2e2e44", background: "#0e0e1c", textAlign: "center", cursor: "pointer", transition: "border-color 0.15s, background 0.15s" }}
          onMouseEnter=${e => { e.currentTarget.style.borderColor = "#5a4fcf"; e.currentTarget.style.background = "#12122a"; }}
          onMouseLeave=${e => { e.currentTarget.style.borderColor = "#2e2e44"; e.currentTarget.style.background = "#0e0e1c"; }}
        >
          <div style=${{ fontSize: 22, marginBottom: 6 }}>🖼️</div>
          <div style=${{ fontSize: 13, color: "#666" }}>Click or drag & drop an image</div>
          <div style=${{ fontSize: 11, color: "#444", marginTop: 3 }}>JPG, PNG, WebP</div>
        </div>
      `}
      <input ref=${fileInputRef} type="file" accept="image/*" onChange=${onFileChange} style=${{ display: "none" }} />
    </div>
  `;
    }

    function App() {
      const [cfg, setCfg] = useState(loadCfg);
      const [models, setModels] = useState([]);
      const [modelStatus, setModelStatus] = useState({ loading: true, ok: false, error: "" });

      const [target, setTarget] = useState("ltx");
      const [scene, setScene] = useState("");
      const [duration, setDuration] = useState("97 frames (~4 seconds)");
      const [writerModel, setWriterModel] = useState("");
      const [visionModel, setVisionModel] = useState("");
      const [writerManual, setWriterManual] = useState("mistral-nemo");
      const [visionManual, setVisionManual] = useState("qwen2.5vl:7b");
      const [outputCount, setOutputCount] = useState(1);
      const [style, setStyle] = useState("auto");
      const [creativity, setCreativity] = useState("balanced");
      const [dialogue, setDialogue] = useState("");
      const [delivery, setDelivery] = useState("");
      const [frameMode, setFrameMode] = useState("single");
      const [firstImg, setFirstImg] = useState(null);
      const [lastImg, setLastImg] = useState(null);
      const [selectedMoves, setSelectedMoves] = useState(new Set());
      const [cameraOpen, setCameraOpen] = useState(false);
      const [results, setResults] = useState([]);
      const [caption, setCaption] = useState("");
      const [visionBusy, setVisionBusy] = useState(false);
      const [globalError, setGlobalError] = useState("");
      const [copied, setCopied] = useState(null);
      const [history, setHistory] = useState([]);
      const [historyOpen, setHistoryOpen] = useState(false);
      const [adminMode, setAdminMode] = useState(false);
      const [adminSystem, setAdminSystem] = useState(() => TARGETS["ltx"].system);
      const [adminSystemOpen, setAdminSystemOpen] = useState(false);
      const [adminUserMsg, setAdminUserMsg] = useState("");
      const [pendingSend, setPendingSend] = useState(false);
      const pendingSnapshotRef = useRef(null);

      const t = TARGETS[target];
      const show = t.show;

      const effectiveWriter = models.length ? writerModel : writerManual.trim();
      const effectiveVision = models.length ? visionModel : visionManual.trim();

      useEffect(() => { saveCfg(cfg); }, [cfg]);
      useEffect(() => {
        try { const raw = localStorage.getItem("gen-history"); if (raw) setHistory(JSON.parse(raw)); } catch { }
      }, []);

      const reloadModels = async () => {
        setModelStatus({ loading: true, ok: false, error: "" });
        try {
          const ids = await fetchModels(cfg);
          setModels(ids);
          setModelStatus({ loading: false, ok: true, error: "" });
          setWriterModel(prev => (prev && ids.includes(prev)) ? prev : pickWriter(ids));
          setVisionModel(prev => (prev && ids.includes(prev)) ? prev : pickVision(ids));
        } catch (e) {
          setModels([]);
          setModelStatus({ loading: false, ok: false, error: e.message });
        }
      };
      useEffect(() => { reloadModels(); /* eslint-disable-next-line */ }, [cfg.base, cfg.apiKey]);
      useEffect(() => { setAdminSystem(TARGETS[target].system); setPendingSend(false); setAdminUserMsg(""); }, [target]);

      const saveHistory = (snap, outputs) => {
        setHistory(prev => {
          const list = [{ ...snap, outputs }, ...prev].slice(0, 10);
          try { localStorage.setItem("gen-history", JSON.stringify(list)); } catch { }
          return list;
        });
      };
      const clearHistory = () => { try { localStorage.removeItem("gen-history"); } catch { } setHistory([]); };
      const restore = (h) => {
        setTarget(h.target); setOutputCount(h.outputCount);
        if (h.model) { setWriterModel(h.model); setWriterManual(h.model); }
        if (h.vision) { setVisionModel(h.vision); setVisionManual(h.vision); }
        setDuration(h.duration); setStyle(h.style); setCreativity(h.creativity); setFrameMode(h.frameMode);
        setSelectedMoves(new Set(h.moves || []));
        setScene(h.scene || ""); setDialogue(h.dialogue || ""); setDelivery(h.delivery || "");
        setFirstImg(null); setLastImg(null); setResults([]); setCaption("");
      };

      const sendToWriter = async () => {
        setPendingSend(false);
        const snapshot = pendingSnapshotRef.current;
        const systemToUse = adminSystem;
        const userToUse = adminUserMsg;
        if (outputCount === 1) {
          const lbl = effectiveWriter;
          setResults([{ label: lbl, text: "", usage: null, loading: true, error: "" }]);
          try {
            const { text, usage } = await callOllama(effectiveWriter, userToUse, systemToUse, cfg, cfg.temperature);
            setResults([{ label: lbl, text, usage, loading: false, error: "" }]);
            if (snapshot) saveHistory(snapshot, [{ label: lbl, text }]);
          } catch (e) { setResults([{ label: lbl, text: "", usage: null, loading: false, error: e.message }]); }
        } else {
          const variants = VARIANT_TEMPS.map(temp => ({ label: `${effectiveWriter} · T${temp}`, temp }));
          setResults(variants.map(v => ({ label: v.label, text: "", usage: null, loading: true, error: "" })));
          const proms = variants.map((v, i) =>
            callOllama(effectiveWriter, userToUse, systemToUse, cfg, v.temp)
              .then(({ text, usage }) => { setResults(prev => prev.map((r, idx) => idx === i ? { ...r, text, usage, loading: false } : r)); return { label: v.label, text }; })
              .catch(e => { setResults(prev => prev.map((r, idx) => idx === i ? { ...r, loading: false, error: e.message } : r)); return { label: v.label, text: `(error: ${e.message})` }; })
          );
          const outs = await Promise.all(proms);
          if (snapshot) saveHistory(snapshot, outs);
        }
      };

      const toggleMove = (id) => setSelectedMoves(prev => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; });
      const switchMode = (m) => { setFrameMode(m); setFirstImg(null); setLastImg(null); };
      const switchTarget = (id) => { setTarget(id); setFirstImg(null); setLastImg(null); setFrameMode("single"); setResults([]); setCaption(""); };

      // STAGE 1: describe image frame(s) with the vision model.
      const captionImages = async () => {
        let system, content;
        if (t.type === "image") {
          system = VISION_PROMPT_FLUX;
          content = [
            { type: "image", source: { type: "base64", media_type: firstImg.mediaType, data: firstImg.base64 } },
            { type: "text", text: scene.trim() ? `The user's intended subject/scene: ${scene.trim()}\nDescribe the reference image in precise, prompt-ready language.` : `Describe this reference image in precise, prompt-ready language.` },
          ];
        } else if (frameMode === "firstlast") {
          system = VISION_PROMPT_LTX_FIRSTLAST;
          content = [
            { type: "text", text: "FIRST FRAME (clip starts here):" },
            { type: "image", source: { type: "base64", media_type: firstImg.mediaType, data: firstImg.base64 } },
            { type: "text", text: "LAST FRAME (clip ends here):" },
            { type: "image", source: { type: "base64", media_type: lastImg.mediaType, data: lastImg.base64 } },
            { type: "text", text: "Describe both frames and the change, as instructed." },
          ];
        } else {
          system = VISION_PROMPT_LTX_SINGLE;
          content = [
            { type: "image", source: { type: "base64", media_type: firstImg.mediaType, data: firstImg.base64 } },
            { type: "text", text: "Describe this first frame as instructed." },
          ];
        }
        const { text } = await callOllama(effectiveVision, content, system, cfg, 0.3);
        return text;
      };

      const enhance = async () => {
        const hasImg = t.type === "image" ? !!firstImg : (frameMode === "firstlast" ? (firstImg && lastImg) : !!firstImg);
        const canGen = t.type === "image" ? (scene.trim() || firstImg)
          : (frameMode === "firstlast" ? (firstImg && lastImg) : (scene.trim() || firstImg));
        if (!canGen) return;
        if (!effectiveWriter) { setGlobalError("Pick a Writer model (open ⚙ Local backend → Reload models, or type one)."); return; }
        if (hasImg && !effectiveVision) { setGlobalError("Image inputs need a Vision model — pick one or type one (e.g. qwen2.5vl:7b)."); return; }
        setGlobalError(""); setCopied(null); setCaption(""); setPendingSend(false);

        const styleObj = STYLE_OPTIONS.find(s => s.id === style);
        const creativityText = creativity === "balanced" ? ""
          : t.type === "image"
            ? (creativity === "faithful"
              ? `\n\nImage fidelity: FAITHFUL — recreate the reference closely; keep its subject, composition and palette, deviating only slightly.`
              : `\n\nImage fidelity: LOOSE — treat the reference as rough inspiration only. Invent freely, take creative risks, and prioritize the chosen style over literal resemblance.`)
            : (creativity === "faithful"
              ? `\n\nCreative latitude: FAITHFUL — keep the proposed motion minimal and literal to the scene.`
              : `\n\nCreative latitude: LOOSE — be genuinely inventive and surprising with the action, framing and atmosphere (within LTX motion limits); don't settle for the obvious motion.`);
        const stylePart = (styleObj && styleObj.id !== "auto" ? `\n\nStyle / mood — let this genuinely shape the mood and treatment, but keep the scene believable and the subject intact unless the style itself calls for breaking realism (e.g. surreal). Favor clever, well-judged choices over crude exaggeration: ${styleObj.label} — ${styleObj.hint}` : "")
          + creativityText
          + (show.dialogue && dialogue.trim() ? `\n\nSpoken dialogue — include these EXACT words in quotation marks, broken into short phrases with physical acting beats between them${delivery.trim() ? `; delivery/voice: ${delivery.trim()}` : ""}:\n"${dialogue.trim()}"` : "");
        const cameraPart = (t.type !== "image" && selectedMoves.size > 0)
          ? `\n\nRequested camera moves (incorporate these):\n${CAMERA_GROUPS.flatMap(g => g.moves).filter(m => selectedMoves.has(m.id)).map(m => `- ${m.prompt}`).join("\n")}`
          : "";

        // STAGE 1 — vision caption (only when an image is present)
        let frameDescription = null;
        if (hasImg) {
          setVisionBusy(true);
          setResults([]);
          try {
            frameDescription = await captionImages();
            setCaption(frameDescription);
          } catch (e) {
            setVisionBusy(false);
            setGlobalError(`Vision step failed (${effectiveVision}): ${e.message}`);
            return;
          }
          setVisionBusy(false);
        }

        // STAGE 2 — build the writer's text prompt
        let userText;
        if (t.type === "image") {
          const ref = frameDescription ? `Reference image description:\n${frameDescription}\n\n` : "";
          const scenePart = scene.trim()
            ? `Image description / subject:\n${scene}`
            : (frameDescription ? `No extra description — base the FLUX prompt on the reference description above.` : `No description provided.`);
          userText = `${ref}${scenePart}${stylePart}`;
        } else if (frameMode === "firstlast") {
          const frames = frameDescription ? `Frames (already established — do not restate their static contents):\n${frameDescription}\n\n` : "";
          const scenePart = scene.trim()
            ? `Transition description:\n${scene}`
            : `No description provided — infer the natural motion that carries the scene from the first frame to the last.`;
          userText = `MODE: First-to-last-frame interpolation. The clip begins exactly on the FIRST frame and ends exactly on the LAST frame; describe the motion and camera that bridge them.\n\n${frames}Target duration: ${duration}\n\n${scenePart}${cameraPart}${stylePart}`;
        } else {
          const frame = frameDescription ? `FIRST FRAME (already established — do not restate it; only describe what happens over time):\n${frameDescription}\n\n` : "";
          const scenePart = scene.trim()
            ? `Basic scene description:\n${scene}`
            : (frameDescription ? `No scene description provided — propose ONE fitting cinematic moment of motion that suits the frame.` : `No scene description provided.`);
          userText = `${frame}Target duration: ${duration}\n\n${scenePart}${cameraPart}${stylePart}`;
        }

        const snapshot = {
          ts: Date.now(), target, outputCount, model: effectiveWriter, vision: hasImg ? effectiveVision : null, duration,
          style, creativity, frameMode, moves: [...selectedMoves],
          scene, dialogue: show.dialogue ? dialogue : "", delivery: show.dialogue ? delivery : "",
          firstImg: firstImg?.fileName || null, lastImg: lastImg?.fileName || null,
        };

        // STAGE 2 — run the writer
        if (adminMode) {
          setAdminUserMsg(userText);
          pendingSnapshotRef.current = snapshot;
          setPendingSend(true);
          return;
        }
        if (outputCount === 1) {
          const lbl = effectiveWriter;
          setResults([{ label: lbl, text: "", usage: null, loading: true, error: "" }]);
          try {
            const { text, usage } = await callOllama(effectiveWriter, userText, t.system, cfg, cfg.temperature);
            setResults([{ label: lbl, text, usage, loading: false, error: "" }]);
            saveHistory(snapshot, [{ label: lbl, text }]);
          } catch (e) { setResults([{ label: lbl, text: "", usage: null, loading: false, error: e.message }]); }
        } else {
          const variants = VARIANT_TEMPS.map(temp => ({ label: `${effectiveWriter} · T${temp}`, temp }));
          setResults(variants.map(v => ({ label: v.label, text: "", usage: null, loading: true, error: "" })));
          const proms = variants.map((v, i) =>
            callOllama(effectiveWriter, userText, t.system, cfg, v.temp)
              .then(({ text, usage }) => { setResults(prev => prev.map((r, idx) => idx === i ? { ...r, text, usage, loading: false } : r)); return { label: v.label, text }; })
              .catch(e => { setResults(prev => prev.map((r, idx) => idx === i ? { ...r, loading: false, error: e.message } : r)); return { label: v.label, text: `(error: ${e.message})` }; })
          );
          const outs = await Promise.all(proms);
          saveHistory(snapshot, outs);
        }
      };

      const copy = (idx) => { navigator.clipboard.writeText(results[idx].text); setCopied(idx); setTimeout(() => setCopied(null), 2000); };
      const editResult = (idx, value) => setResults(prev => prev.map((r, i) => i === idx ? { ...r, text: value } : r));

      const writing = results.some(r => r.loading);
      const isLoading = visionBusy || writing;
      const canGenerate = t.type === "image" ? (!!scene.trim() || !!firstImg)
        : (frameMode === "firstlast" ? (!!firstImg && !!lastImg) : (!!scene.trim() || !!firstImg));
      const proposeMode = !scene.trim() && (t.type === "image" ? !!firstImg : (frameMode === "firstlast" ? (firstImg && lastImg) : !!firstImg));
      const buttonLabel = visionBusy ? "👁 Reading image…"
        : writing ? "✦ Writing prompt…"
          : t.type === "image" ? (proposeMode ? "✦ Describe image as prompt" : "✦ Enhance prompt")
            : (proposeMode ? (frameMode === "firstlast" ? "✦ Propose motion between frames" : "✦ Propose scene from image") : "✦ Enhance Prompt");

      let sceneHint = "";
      if (t.type === "image") sceneHint = firstImg ? "(optional — leave blank to describe the reference image)" : "";
      else if (frameMode === "firstlast") sceneHint = "(optional — leave blank to let the writer propose the motion between your frames)";
      else if (firstImg) sceneHint = "(optional — leave blank to let the writer propose one from the frame)";

      const sceneLabel = t.type === "image" ? "Image Description" : "Your Scene";
      const scenePlaceholder = t.type === "image"
        ? "e.g. A weathered fisherman mending nets at dawn, harbor and boats behind him"

      return html`

        </div>
        <button onClick=${() => { setAdminMode(v => !v); setPendingSend(false); }} style=${{ flexShrink: 0, padding: "5px 12px", borderRadius: 6, border: "1px solid", borderColor: adminMode ? "#7c6af7" : "#333", background: adminMode ? "#2d2060" : "#1a1a2e", color: adminMode ? "#c4b8ff" : "#666", fontSize: 11, cursor: "pointer", marginTop: 4 }}>
          ${adminMode ? "⚙ Admin: ON" : "⚙ Admin"}
        </button>
      </div>

      <${ConfigBar} cfg=${cfg} setCfg=${setCfg} models=${models} modelStatus=${modelStatus} reloadModels=${reloadModels} />

      <div style=${{ marginBottom: 18 }}>
        <label style=${{ fontSize: 11, color: "#777", display: "block", marginBottom: 6, textTransform: "uppercase", letterSpacing: "0.5px" }}>Generate for</label>
        <div style=${{ display: "flex", gap: 6, flexWrap: "wrap" }}>
          ${Object.values(TARGETS).map(tg => html`<button key=${tg.id} onClick=${() => switchTarget(tg.id)} style=${btn(target === tg.id)}>${tg.label}</button>`)}
        </div>

      <div style=${{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 18 }}>
        <div style=${{ flex: "1 1 240px" }}>
          <label style=${{ fontSize: 11, color: "#777", display: "block", marginBottom: 6, textTransform: "uppercase", letterSpacing: "0.5px" }}>Writer model <span style=${{ color: "#555", textTransform: "none", letterSpacing: 0 }}>· builds the prompt</span></label>
          ${models.length > 0
          ? html`<select style=${selStyle} value=${writerModel} onChange=${e => setWriterModel(e.target.value)}>${models.map(m => html`<option key=${m} value=${m}>${m}</option>`)}</select>`
          : html`<input style=${selStyle} value=${writerManual} onChange=${e => setWriterManual(e.target.value)} placeholder="mistral-nemo" spellCheck=${false} />`}
        </div>
        <div style=${{ flex: "1 1 240px" }}>

          ${models.length > 0
          ? html`<select style=${selStyle} value=${visionModel} onChange=${e => setVisionModel(e.target.value)}>${models.map(m => html`<option key=${m} value=${m}>${m}</option>`)}</select>`
          : html`<input style=${selStyle} value=${visionManual} onChange=${e => setVisionManual(e.target.value)} placeholder="qwen2.5vl:7b" spellCheck=${false} />`}

          ${OUTPUT_COUNT_OPTIONS.map(o => html`<button key=${o.value} onClick=${() => setOutputCount(o.value)} style=${btn(outputCount === o.value)}>${o.label}</button>`)}

          <div style=${{ display: "flex", gap: 6, flexWrap: "wrap" }}>

          </div>
          <p style=${{ fontSize: 11, color: "#555", margin: "6px 0 0", lineHeight: 1.5 }}>Sweet spot: <span style=${{ color: "#9a8fd8" }}>≤10s renders cleanest</span>. 12–20s can show subject drift — consider the Extend workflow (e.g. 8s + 8s) for longer clips.</p>
        </div>

      <div style=${{ marginBottom: 18 }}>

                            ${active && html`<span style=${{ color: "#fff", fontSize: 9, lineHeight: 1 }}>✓</span>`}
                          </span>
                          <span style=${{ fontSize: 12, color: active ? "#c4b8ff" : "#777" }}>${m.label}</span>
                        </label>
                      `;
          })}
                  </div>
                </div>
              `)}
              ${selectedMoves.size > 0 && html`<button onClick=${() => setSelectedMoves(new Set())} style=${{ marginTop: 4, fontSize: 11, color: "#555", background: "none", border: "none", cursor: "pointer", padding: 0 }}>Clear all</button>`}
            </div>
          `}
        </div>
      `}

      <div style=${{ marginBottom: 18 }}>
        <label style=${{ fontSize: 11, color: "#777", display: "block", marginBottom: 6, textTransform: "uppercase", letterSpacing: "0.5px" }}>
          ${sceneLabel} ${sceneHint && html`<span style=${{ color: "#555", textTransform: "none", letterSpacing: 0 }}>${sceneHint}</span>`}
        </label>
        <textarea value=${scene} onChange=${e => setScene(e.target.value)} placeholder=${scenePlaceholder} rows=${4}
          style=${{ width: "100%", boxSizing: "border-box", background: "#12121f", border: "1px solid #2e2e44", borderRadius: 8, padding: "12px 14px", color: "#e0e0f0", fontSize: 14, resize: "vertical", outline: "none", lineHeight: 1.6, transition: "border-color 0.15s" }}
          onFocus=${e => e.target.style.borderColor = "#5a4fcf"} onBlur=${e => e.target.style.borderColor = "#2e2e44"} />
      </div>

      ${show.dialogue && html`
        <div style=${{ marginBottom: 18 }}>
          <label style=${{ fontSize: 11, color: "#777", display: "block", marginBottom: 6, textTransform: "uppercase", letterSpacing: "0.5px" }}>
            Dialogue <span style=${{ color: "#555", textTransform: "none", letterSpacing: 0 }}>(optional — spoken aloud; needs 8s+ for more than a few words)</span>
          </label>
          <textarea value=${dialogue} onChange=${e => setDialogue(e.target.value)} placeholder=${"Exact words to be spoken, e.g.  We need to leave. Now."} rows=${2}
            style=${{ width: "100%", boxSizing: "border-box", background: "#12121f", border: "1px solid #2e2e44", borderRadius: 8, padding: "10px 14px", color: "#e0e0f0", fontSize: 14, resize: "vertical", outline: "none", lineHeight: 1.5, transition: "border-color 0.15s" }}
            onFocus=${e => e.target.style.borderColor = "#5a4fcf"} onBlur=${e => e.target.style.borderColor = "#2e2e44"} />
          ${dialogue.trim() && duration === "97 frames (~4 seconds)" && dialogue.trim().split(/\s+/).length > 6 && html`
            <div style=${{ fontSize: 11, color: "#f0b070", marginTop: 6, lineHeight: 1.5 }}>That's a lot of words for a ~4s clip — speech may rush or get cut. Consider 8s+ for a full line.</div>
          `}
          <input value=${delivery} onChange=${e => setDelivery(e.target.value)} placeholder="Delivery / voice / accent (optional) — e.g. calm and slow, urgent whisper, British accent"
            style=${{ width: "100%", boxSizing: "border-box", marginTop: 8, background: "#12121f", border: "1px solid #2e2e44", borderRadius: 8, padding: "9px 14px", color: "#e0e0f0", fontSize: 13, outline: "none", transition: "border-color 0.15s" }}
            onFocus=${e => e.target.style.borderColor = "#5a4fcf"} onBlur=${e => e.target.style.borderColor = "#2e2e44"} />
        </div>
      `}

      ${show.frameMode && html`
        <div style=${{ marginBottom: 14 }}>
          <label style=${{ fontSize: 11, color: "#777", display: "block", marginBottom: 6, textTransform: "uppercase", letterSpacing: "0.5px" }}>Image Input</label>
          <div style=${{ display: "flex", gap: 6 }}>
            <button onClick=${() => switchMode("single")} style=${btn(frameMode === "single")}>Single image</button>
            <button onClick=${() => switchMode("firstlast")} style=${btn(frameMode === "firstlast")}>First → Last frame</button>

          ${frameMode === "firstlast" && html`<p style=${{ fontSize: 11, color: "#555", margin: "6px 0 0", lineHeight: 1.5 }}>End-frame interpolation: the clip starts on the first frame and ends on the last. Both frames required.</p>`}
        </div>

      ${frameMode === "single" || t.type === "image"
          ? html`<${ImagePanel} key=${`${target}-single`} label="Reference Image" hint="(optional)" onChange=${setFirstImg} presets=${t.resolutions} showTwoStage=${show.twoStage} />`
          : html`
          <>
            <${ImagePanel} key=${`${target}-first`} label="First Frame" hint="(clip starts here)" onChange=${setFirstImg} presets=${t.resolutions} showTwoStage=${show.twoStage} />
            <${ImagePanel} key=${`${target}-last`} label="Last Frame" hint="(clip ends here)" onChange=${setLastImg} presets=${t.resolutions} showTwoStage=${show.twoStage} />
          </>
        `
        }

      ${adminMode && html`
        <div style=${{ marginBottom: 18, background: "#0e0e1c", border: "1px solid #3a2f6e", borderRadius: 10, padding: "12px 16px" }}>

            <span style=${{ display: "flex", alignItems: "center", gap: 8, color: "#9a8fd8", fontSize: 11, textTransform: "uppercase", letterSpacing: "0.5px" }}>
              <span style=${{ display: "inline-block", transition: "transform 0.2s", transform: adminSystemOpen ? "rotate(90deg)" : "rotate(0deg)" }}>▶</span>
              System Prompt
            </span>
            <span style=${{ fontSize: 10, color: "#555" }}>editable · sent on every generation</span>
          </button>
          ${adminSystemOpen && html`
            <div style=${{ marginTop: 12 }}>
              <textarea value=${adminSystem} onChange=${e => setAdminSystem(e.target.value)} rows=${12}
                style=${{ width: "100%", boxSizing: "border-box", background: "#12121f", border: "1px solid #2e2e44", borderRadius: 8, padding: "10px 12px", color: "#b0b8d0", fontSize: 12, fontFamily: "monospace", resize: "vertical", outline: "none", lineHeight: 1.5 }} />
              <button onClick=${() => setAdminSystem(t.system)} style=${{ marginTop: 6, fontSize: 11, color: "#777", background: "none", border: "1px solid #333", borderRadius: 5, padding: "3px 10px", cursor: "pointer" }}>Reset to default</button>
            </div>
          `}
        </div>
      `}

      ${adminMode && pendingSend && html`
        <div style=${{ marginBottom: 18, background: "#0e0e1c", border: "1px solid #3a2f6e", borderRadius: 10, padding: "14px 16px" }}>
          <div style=${{ fontSize: 11, color: "#9a8fd8", textTransform: "uppercase", letterSpacing: "0.5px", marginBottom: 10 }}>User Message · review & edit before sending</div>
          <textarea value=${adminUserMsg} onChange=${e => setAdminUserMsg(e.target.value)} rows=${10}
            style=${{ width: "100%", boxSizing: "border-box", background: "#12121f", border: "1px solid #2e2e44", borderRadius: 8, padding: "10px 12px", color: "#b0b8d0", fontSize: 12, fontFamily: "monospace", resize: "vertical", outline: "none", lineHeight: 1.5 }} />
          <div style=${{ display: "flex", gap: 10, marginTop: 12, alignItems: "center" }}>
            <button onClick=${sendToWriter} disabled=${writing}
              style=${{ padding: "10px 24px", borderRadius: 8, border: "none", background: writing ? "#2a2a3f" : "linear-gradient(135deg, #5a4fcf, #8b5cf6)", color: writing ? "#555" : "#fff", fontSize: 14, fontWeight: 600, cursor: writing ? "not-allowed" : "pointer", transition: "all 0.15s" }}>
              ${writing ? "✦ Writing prompt…" : "→ Send to Writer"}
            </button>
            <button onClick=${() => setPendingSend(false)} disabled=${writing} style=${{ padding: "9px 18px", borderRadius: 8, border: "1px solid #333", background: "none", color: "#666", fontSize: 13, cursor: writing ? "not-allowed" : "pointer" }}>Cancel</button>
          </div>
        </div>
      `}

      <button onClick=${enhance} disabled=${isLoading || !canGenerate || pendingSend}
        style=${{ padding: "10px 24px", borderRadius: 8, border: "none", background: isLoading || !canGenerate || pendingSend ? "#2a2a3f" : "linear-gradient(135deg, #5a4fcf, #8b5cf6)", color: isLoading || !canGenerate || pendingSend ? "#555" : "#fff", fontSize: 14, fontWeight: 600, cursor: isLoading || !canGenerate || pendingSend ? "not-allowed" : "pointer", transition: "all 0.15s", marginTop: 6 }}>
        ${buttonLabel}
      </button>

      ${globalError && html`<div style=${{ marginTop: 16, padding: "12px 14px", background: "#2a1020", border: "1px solid #5a2030", borderRadius: 8, fontSize: 13, color: "#f87171" }}>${globalError}</div>`}

      ${caption && html`
        <details style=${{ marginTop: 16, background: "#0e0e1c", border: "1px solid #2a2a3f", borderRadius: 8, padding: "10px 14px" }}>
          <summary style=${{ cursor: "pointer", fontSize: 11, color: "#6f7a92", textTransform: "uppercase", letterSpacing: "0.5px" }}>👁 vision description (read-only) · ${effectiveVision}</summary>
          <div style=${{ marginTop: 8, fontSize: 12.5, color: "#9aa6c0", lineHeight: 1.6, whiteSpace: "pre-wrap" }}>${caption}</div>
        </details>
      `}

      ${results.length > 0 && html`
        <div style=${{ marginTop: 24, display: "flex", flexDirection: "column", gap: 20 }}>
          ${results.map((r, i) => html`
            <div key=${i}>
              <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                <label style=${{ fontSize: 11, color: "#777", textTransform: "uppercase", letterSpacing: "0.5px" }}>${r.label}</label>

                  ${r.usage && html`<span style=${{ fontSize: 11, color: "#555" }}>in ${r.usage.input_tokens} · out ${r.usage.output_tokens} tokens</span>`}
                  ${r.text && html`<button onClick=${() => copy(i)} style=${{ padding: "5px 12px", borderRadius: 6, border: "1px solid #333", background: copied === i ? "#1a3a2a" : "#1a1a2e", color: copied === i ? "#4ade80" : "#888", fontSize: 11, cursor: "pointer" }}>${copied === i ? "✓ Copied" : "Copy"}</button>`}

        <div style=${{ marginTop: 28, borderTop: "1px solid #1e1e30", paddingTop: 16 }}>
          <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
            <button onClick=${() => setHistoryOpen(v => !v)} style=${{ display: "flex", alignItems: "center", gap: 8, background: "none", border: "none", padding: 0, cursor: "pointer", color: "#777", fontSize: 11, textTransform: "uppercase", letterSpacing: "0.5px" }}>
              <span style=${{ display: "inline-block", transition: "transform 0.2s", transform: historyOpen ? "rotate(90deg)" : "rotate(0deg)" }}>▶</span>
              History (${history.length})
            </button>
            ${historyOpen && html`<button onClick=${clearHistory} style=${{ fontSize: 11, color: "#a06a6a", background: "none", border: "1px solid #3a2040", borderRadius: 6, padding: "3px 10px", cursor: "pointer" }}>Clear</button>`}
          </div>
          ${historyOpen && html`
            <div style=${{ display: "flex", flexDirection: "column", gap: 12 }}>
              ${history.map((h, i) => {
          const tg = TARGETS[h.target];
          const ml = h.outputCount === 1 ? h.model : "3 variants";
          const sl = STYLE_OPTIONS.find(s => s.id === h.style)?.label;
          const cl = CREATIVITY_OPTIONS.find(c => c.id === h.creativity)?.label;
          const moves = (h.moves || []).map(moveLabel);
          return html`
                  <div key=${i} style=${{ background: "#0e0e1c", border: "1px solid #2e2e44", borderRadius: 10, padding: "12px 14px" }}>
                    <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 8, marginBottom: 6 }}>
                      <span style=${{ fontSize: 11, color: "#888" }}>${new Date(h.ts).toLocaleString()}</span>
                      <button onClick=${() => restore(h)} style=${{ fontSize: 11, color: "#c4b8ff", background: "#1e1850", border: "1px solid #3a2f6e", borderRadius: 6, padding: "3px 10px", cursor: "pointer", flexShrink: 0 }}>Restore settings</button>
                    </div>
                    <div style=${{ fontSize: 11.5, color: "#9a8fd8", marginBottom: 6 }}>
                      ${tg?.label} · ${ml}${h.vision ? ` · 👁 ${h.vision}` : ""}${h.duration && tg?.type !== "image" ? ` · ${h.duration}` : ""}${sl && sl !== "Auto" ? ` · ${sl}` : ""}${cl && cl !== "Balanced" ? ` · ${cl}` : ""}${h.frameMode === "firstlast" ? " · first→last" : ""}
                    </div>
                    ${moves.length > 0 && html`<div style=${{ fontSize: 11, color: "#777", marginBottom: 6 }}>Camera: ${moves.join(", ")}</div>`}
                    <div style=${{ fontSize: 12, color: "#bbb", marginBottom: 6 }}>${h.scene ? h.scene : html`<span style=${{ color: "#666" }}>(proposed from image)</span>`}</div>
                    ${h.dialogue && html`<div style=${{ fontSize: 12, color: "#bbb", marginBottom: 6 }}>Dialogue: "${h.dialogue}"${h.delivery ? ` (${h.delivery})` : ""}</div>`}
                    ${(h.firstImg || h.lastImg) && html`<div style=${{ fontSize: 11, color: "#777", marginBottom: 6 }}>${h.firstImg ? `Image: ${h.firstImg}` : ""}${h.lastImg ? ` · Last: ${h.lastImg}` : ""}</div>`}
                    <div style=${{ display: "flex", flexDirection: "column", gap: 8, marginTop: 6 }}>
                      ${(h.outputs || []).map((o, oi) => html`
                        <div key=${oi} style=${{ background: "#12121f", border: "1px solid #2a2a3f", borderRadius: 8, padding: "8px 10px" }}>
                          <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
                            <span style=${{ fontSize: 10, color: "#666", textTransform: "uppercase", letterSpacing: "0.5px" }}>${o.label}</span>
                            <button onClick=${() => navigator.clipboard.writeText(o.text)} style=${{ fontSize: 10, color: "#888", background: "none", border: "1px solid #333", borderRadius: 5, padding: "2px 8px", cursor: "pointer" }}>Copy</button>
                          </div>
                          <div style=${{ fontSize: 12.5, color: "#cfcfe0", lineHeight: 1.6, whiteSpace: "pre-wrap", fontFamily: "'Georgia', serif" }}>${o.text}</div>
                        </div>
                      `)}
                    </div>
                  </div>
                `;
        })}
            </div>
          `}
        </div>
      `}
    </div>
  `;
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(html`<${App} />`);
  </script>
</body>

</html>
